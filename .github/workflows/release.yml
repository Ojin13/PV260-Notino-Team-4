name: Release

# Build a self-contained Windows .exe and attach it to a GitHub Release
# on every merge to main. The presentation site links to
# `releases/latest/download/Popocatepetl.CLI-win-x64.zip`, so as soon as
# this workflow finishes the new build is what the public download serves.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as prerelease (keeps it out of /releases/latest)'
        type: boolean
        default: true
      tag_suffix:
        description: 'Optional tag suffix, e.g. "test" → v2026.05.12.42-test'
        type: string
        default: 'test'

permissions:
  contents: write   # needed to create the release and push the tag

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "v$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}"
          $suffix = '${{ inputs.tag_suffix }}'
          if ($suffix) { $tag = "$tag-$suffix" }
          "tag=$tag"               | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=Popocatepetl $tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore Popocatepetl.CLI/Popocatepetl.CLI.csproj

      - name: Publish CLI (win-x64, self-contained, single-file)
        shell: pwsh
        run: |
          dotnet publish Popocatepetl.CLI/Popocatepetl.CLI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=embedded `
            --output publish

      - name: Package as zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish/* `
            -DestinationPath Popocatepetl.CLI-win-x64.zip `
            -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          # Manual dispatches default to prerelease so test builds don't
          # replace /releases/latest, which the presentation site links to.
          # Pushes to main always produce a real (non-prerelease) build.
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Popocatepetl.CLI-win-x64.zip
